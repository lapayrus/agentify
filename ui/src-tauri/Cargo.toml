[package]
name = "agentify-shell"
version = "0.1.2"
edition = "2021"
rust-version = "1.94"
license = "UNLICENSED"
publish = false
description = "Agentify desktop shell: a Tauri v2 window over the daemon API"

# Its own workspace: the shell pulls the whole webview dependency tree, and it
# must not gate `cargo test --workspace` on the daemon crates.
[workspace]

[lib]
name = "agentify_shell"
path = "src/lib.rs"

[[bin]]
name = "agentify-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentify-bootstrap = { path = "../../crates/bootstrap" }
agentify-proto = { path = "../../crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# The daemon is owned through a Job Object, so a shell crash takes it and its
# Caddy child with it.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
agentify-daemon = { path = "../../crates/daemon" }
tempfile = "3"
ureq = { version = "2", default-features = false }
