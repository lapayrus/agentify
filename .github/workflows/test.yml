name: Test

on:
  push:
    branches: ["**"]
    # A release tag runs its own build; it does not need the test suite twice.
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the workspace test suite
        # The default Backend is the scripted fake, and none of the WSL, Caddy,
        # or keyring gates are set, so the security acceptance suite runs here
        # without touching the host machine.
        run: cargo test --workspace
