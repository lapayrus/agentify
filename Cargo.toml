[workspace]
resolver = "2"
members = [
  "crates/proto",
  "crates/manifest",
  "crates/backends",
  "crates/ingress",
  "crates/daemon",
  "crates/mcp",
  "crates/cli",
  "crates/bootstrap",
]
# The Tauri shell is built separately (see ui/README.md): it embeds webview
# assets, so it must not slow down or gate the daemon workspace build.
exclude = ["ui/src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.94"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
agentify-backends = { path = "crates/backends" }
agentify-bootstrap = { path = "crates/bootstrap" }
agentify-ingress = { path = "crates/ingress" }
agentify-manifest = { path = "crates/manifest" }
agentify-proto = { path = "crates/proto" }
anyhow = "1.0"
axum = "0.8"
futures-util = "0.3"
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
ureq = { version = "2.12", default-features = false }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = "limited"
