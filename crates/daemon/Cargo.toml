[package]
name = "agentify-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Agentify control plane: owns state and serves the loopback HTTP API"

[lib]
name = "agentify_daemon"
path = "src/lib.rs"

[[bin]]
name = "agentifyd"
path = "src/main.rs"

[dependencies]
agentify-backends = { workspace = true }
agentify-ingress = { workspace = true }
agentify-manifest = { workspace = true }
agentify-proto = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Windows Hello, for the interactive gesture an Approval requires.
windows = { version = "0.61", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_System_WinRT",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  # `HKCU\Environment`, the fallback a `fromEnv` import reads when the daemon was
  # started by a login item that never inherited the user's variables.
  "Win32_System_Registry",
  # `GetDiskFreeSpaceExW`, for the `whoami` disk-pressure warning.
  "Win32_Storage_FileSystem",
] }
# The OS credential manager, which holds every Project's secret values.
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain on macOS. The daemon is Windows-first in v0; this keeps the crate
# buildable on a Mac while the real adapter is still the Windows one.
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
ureq = { workspace = true }
# The slice test reads `https://web.<project>.localhost` with Caddy's own root
# pinned: it never installs trust in this machine's certificate store.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
# `test-support` exposes the fake Caddy admin endpoint and the fake trust
# installer, so an API-seam test can substitute Caddy without substituting the
# daemon's ingress code.
agentify-ingress = { workspace = true, features = ["test-support"] }
